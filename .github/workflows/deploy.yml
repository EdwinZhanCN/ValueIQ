name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize each environment, including migrations; never interrupt a release.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Require environment configuration
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$DEPLOY_URL" ]; then
            echo "::error::Configure this GitHub environment first. See docs/deployment.md."
            exit 1
          fi
          node -e 'const u = new URL(process.env.DEPLOY_URL); if (u.protocol !== "https:" || u.username || u.password || u.pathname !== "/" || u.search || u.hash) throw Error("DEPLOY_URL must be an HTTPS origin");'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typegen
      # Vite selects and flattens the Cloudflare environment at build time.
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
      - run: pnpm deploy:check
      - name: Verify deployment target
        run: node scripts/check-deploy-target.mjs "$DEPLOY_ENVIRONMENT"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if compgen -G 'drizzle/*.sql' > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --remote --config build/server/wrangler.json
          else
            echo "No D1 migrations yet; skipping."
          fi
      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config build/server/wrangler.json
      - name: Check deployed pages
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "${DEPLOY_URL%/}/" -o /tmp/valueiq-landing.html
          grep -q 'Open workspace' /tmp/valueiq-landing.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "${DEPLOY_URL%/}/workspace" -o /tmp/valueiq-workspace.html
          grep -q 'Agent workspace' /tmp/valueiq-workspace.html
      - name: Record release
        run: |
          echo "Released commit $GITHUB_SHA to $DEPLOY_ENVIRONMENT: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
