name: Seed development mock upload

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Existing development project UUID
        type: string
        required: true

permissions:
  contents: read

# Keep storage writes separate from deployments/migrations on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/seed-demo-upload.test.mjs
      - name: Attach synthetic file to the selected existing project
        env:
          DEMO_PROJECT_ID: ${{ inputs.project_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/seed-demo-upload.mjs "$DEMO_PROJECT_ID"
