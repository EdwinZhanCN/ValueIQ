name: Feature or design proposal
description: Propose behaviour, a data model, or a change in direction.
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The application design here is deliberately undecided: there are no
        tables, no agent state, no tools, and no domain types. A proposal that
        settles part of that design is welcome — but it should say which
        decision it makes, and why now.

        Read [core beliefs](https://github.com/EdwinZhanCN/ValueIQ/blob/main/docs/core-beliefs.md)
        and [architecture](https://github.com/EdwinZhanCN/ValueIQ/blob/main/docs/architecture.md) first.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the problem before the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The behaviour or design you want, concretely enough to review.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else you weighed, and why it lost. Decision records require this section, so it is worth writing now.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Which boundary does this touch
      multiple: true
      options:
        - Data model (db/schema.ts, drizzle/)
        - Agent state or tools (agents/)
        - UI surfaces (app/)
        - Worker configuration or bindings
        - Checks, CI, or developer workflow
        - Documentation or project direction
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This proposal does not present mock or scripted behaviour as a working assessment.
          required: true
        - label: I understand a settled design here needs a decision record in `.agents/decisions/`.
          required: false
