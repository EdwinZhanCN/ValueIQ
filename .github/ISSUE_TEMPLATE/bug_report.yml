name: Bug report
description: Something in the repository does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two quick checks before you file:

        - `/workspace` currently shows a placeholder conversation, and
          assessment and calculations are not connected yet. Placeholder
          content is not a bug.
        - If this is a security issue, please **do not** open a public issue.
          Use the [private advisory form](https://github.com/EdwinZhanCN/ValueIQ/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact commands you ran.
      placeholder: |
        1. pnpm install --frozen-lockfile
        2. pnpm dev
        3. Open /workspace
        4. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen
      options:
        - Landing page (/)
        - Workspace (/workspace)
        - Build or type generation
        - Checks and CI
        - Local D1 or Durable Object state
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, and OS versions. `node -v && pnpm -v` covers most of it.
      placeholder: |
        Node: v24.x
        pnpm: 11.7.0
        OS: macOS 15 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the failing command output. This is rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false
