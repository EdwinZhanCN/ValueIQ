version: 2
updates:
  # Application and tooling dependencies. Grouped so the team reviews one
  # pull request per ecosystem per week instead of a dozen.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # Keep the workflow actions current. GitHub has already retired the Node 20
  # runtime that the original action versions targeted.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
